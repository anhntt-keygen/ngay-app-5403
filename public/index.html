<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Calculator - Máy Tính Bỏ Túi</title>
    <!-- TailwindCSS CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/style.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-['Plus_Jakarta_Sans'] transition-all duration-300">

    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch">
        
        <!-- MAIN CALCULATOR PANEL -->
        <div class="lg:col-span-7 bg-slate-850 p-6 rounded-3xl shadow-2xl border border-slate-800 flex flex-col justify-between calculator-container relative overflow-hidden">
            <!-- Header bar of pocket calculator -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block shadow-md"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block shadow-md"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500 inline-block shadow-md"></span>
                </div>
                <div class="text-xs tracking-widest text-slate-500 font-bold uppercase flex items-center gap-1">
                    <i class="fa-solid fa-microchip text-teal-400"></i> Vibecode v1.0
                </div>
            </div>

            <!-- DIGITAL SCREEN DISPLAY -->
            <div class="bg-slate-950 p-5 rounded-2xl border-2 border-slate-800 shadow-inner mb-6 text-right flex flex-col justify-end min-h-[120px] relative overflow-hidden">
                <!-- Watermark background grid effect -->
                <div class="absolute inset-0 opacity-5 pointer-events-none display-grid-pattern"></div>
                <!-- Expression Line -->
                <div id="expression" class="text-slate-500 text-lg font-mono truncate tracking-wide min-h-[28px] overflow-x-auto whitespace-nowrap scrollbar-none"></div>
                <!-- Live Output Line -->
                <div id="display" class="text-emerald-400 text-4xl md:text-5xl font-mono tracking-tight font-bold truncate select-all overflow-x-auto scrollbar-none">0</div>
            </div>

            <!-- KEYBOARD BUTTONS GRID -->
            <div class="grid grid-cols-4 gap-3 md:gap-4">
                <!-- Row 1: Operations -->
                <button data-type="clear" class="btn-ctrl font-semibold text-lg py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-rose-400 bg-slate-800 hover:bg-slate-750 border border-slate-700/50">C</button>
                <button data-type="sign" class="btn-ctrl font-semibold text-lg py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-teal-400 bg-slate-800 hover:bg-slate-750 border border-slate-700/50">+/-</button>
                <button data-type="percent" class="btn-ctrl font-semibold text-lg py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-teal-400 bg-slate-800 hover:bg-slate-750 border border-slate-700/50">%</button>
                <button data-type="operator" data-val="/" class="btn-op font-bold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-amber-500 bg-slate-850 hover:bg-slate-800 border-2 border-amber-500/20 hover:border-amber-500/50">÷</button>

                <!-- Row 2 -->
                <button data-type="number" data-val="7" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">7</button>
                <button data-type="number" data-val="8" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">8</button>
                <button data-type="number" data-val="9" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">9</button>
                <button data-type="operator" data-val="*" class="btn-op font-bold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-amber-500 bg-slate-850 hover:bg-slate-800 border-2 border-amber-500/20 hover:border-amber-500/50">×</button>

                <!-- Row 3 -->
                <button data-type="number" data-val="4" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">4</button>
                <button data-type="number" data-val="5" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">5</button>
                <button data-type="number" data-val="6" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">6</button>
                <button data-type="operator" data-val="-" class="btn-op font-bold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-amber-500 bg-slate-850 hover:bg-slate-800 border-2 border-amber-500/20 hover:border-amber-500/50">−</button>

                <!-- Row 4 -->
                <button data-type="number" data-val="1" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">1</button>
                <button data-type="number" data-val="2" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">2</button>
                <button data-type="number" data-val="3" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">3</button>
                <button data-type="operator" data-val="+" class="btn-op font-bold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-amber-500 bg-slate-850 hover:bg-slate-800 border-2 border-amber-500/20 hover:border-amber-500/50">+</button>

                <!-- Row 5 -->
                <button data-type="backspace" class="btn-ctrl font-semibold text-lg py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-400 bg-slate-800/35 hover:bg-slate-700/50 border border-slate-850"><i class="fa-solid fa-delete-left"></i></button>
                <button data-type="number" data-val="0" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">0</button>
                <button data-type="decimal" class="btn-num font-semibold text-xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-200 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-800">.</button>
                <button data-type="equals" class="btn-equals font-bold text-2xl py-4 px-2 rounded-2xl transition duration-150 active:scale-95 text-slate-950 bg-gradient-to-br from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30">=</button>
            </div>
        </div>

        <!-- HISTORY SIDE PANEL -->
        <div class="lg:col-span-5 bg-slate-850/80 p-6 rounded-3xl border border-slate-800 flex flex-col justify-between max-h-[580px]">
            <div>
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-800">
                    <h2 class="text-lg font-bold tracking-wide flex items-center gap-2 text-slate-100">
                        <i class="fa-solid fa-clock-rotate-left text-teal-400"></i> Lịch sử tính toán
                    </h2>
                    <button id="clear-history-btn" class="text-xs font-semibold text-rose-400 hover:text-rose-300 transition duration-150 flex items-center gap-1 bg-rose-500/10 py-1.5 px-3 rounded-lg hover:bg-rose-500/20">
                        <i class="fa-regular fa-trash-can"></i> Xóa hết
                    </button>
                </div>
                
                <!-- Scrollable list -->
                <div id="history-list" class="space-y-3 overflow-y-auto max-h-[380px] pr-2 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
                    <!-- Dynamic items will be added here -->
                    <div id="no-history-placeholder" class="text-center py-12 text-slate-500 text-sm">
                        <i class="fa-regular fa-folder-open text-3xl mb-3 block opacity-40"></i>
                        Chưa có lịch sử phép tính nào.
                    </div>
                </div>
            </div>

            <!-- Quick Tips Panel -->
            <div class="mt-4 pt-4 border-t border-slate-800/60 text-xs text-slate-500 space-y-1">
                <p><span class="text-slate-400 font-semibold">Mẹo:</span> Bạn có thể click trực tiếp vào một phép tính cũ trong danh sách lịch sử để nạp lại màn hình.</p>
                <p><span class="text-slate-400 font-semibold">Phím tắt:</span> Hỗ trợ phím số, các phép toán, Enter (=), Backspace (Xóa), Esc (Reset).</p>
            </div>
        </div>

    </div>

    <!-- Script file link -->
    <script src="/app.js"></script>
</body>
</html>
```

---
