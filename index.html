<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Calculator - Máy Tính Bỏ Túi Cao Cấp</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind Config Custom Fonts & Shadows -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans select-none overflow-x-hidden text-slate-100">

  <!-- Container chính chứa toàn bộ Layout -->
  <div class="w-full max-w-4xl flex flex-col md:flex-row gap-6 items-stretch justify-center">
    
    <!-- PHÂN HỆ 1: MÁY TÍNH BỎ TÚI (CALCULATOR ENGINE) -->
    <div class="w-full max-w-sm mx-auto bg-slate-800 rounded-3xl p-6 border border-slate-700/50 shadow-2xl relative flex flex-col justify-between" id="calculator-shell">
      <!-- Thương hiệu máy tính -->
      <div class="flex justify-between items-center mb-4 px-2">
        <span class="text-xs font-bold tracking-widest text-emerald-400 font-mono">VIBECODE FX-999</span>
        <div class="flex gap-1">
          <span class="w-3 h-3 rounded-full bg-red-500 shadow-inner"></span>
          <span class="w-3 h-3 rounded-full bg-yellow-500 shadow-inner"></span>
          <span class="w-3 h-3 rounded-full bg-green-500 shadow-inner"></span>
        </div>
      </div>

      <!-- Màn hình hiển thị LCD cổ điển -->
      <div class="bg-slate-950 rounded-2xl p-4 mb-6 border-2 border-slate-700 shadow-inner text-right font-mono flex flex-col justify-between min-h-[110px] relative overflow-hidden">
        <!-- Đèn nền LCD giả lập -->
        <div class="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>
        <!-- Dòng hiển thị biểu thức phụ (Previous & Current Operation) -->
        <div id="display-formula" class="text-sm text-emerald-600/70 truncate tracking-wide min-h-[20px] max-w-full"></div>
        <!-- Dòng hiển thị chính (Current Operand hoặc Error) -->
        <div id="display-primary" class="text-3xl text-emerald-400 font-bold truncate max-w-full tracking-tighter" data-testid="display-primary">0</div>
      </div>

      <!-- Bàn phím máy tính (Grid Layout) -->
      <div class="grid grid-cols-4 gap-3">
        <!-- Hàng 1: Phím chức năng đặc biệt -->
        <button id="btn-clear" class="btn btn-danger col-span-2 text-base font-bold py-4 rounded-xl shadow-lg transition-all" data-val="C">CLEAR (C)</button>
        <button id="btn-backspace" class="btn btn-warning text-base font-bold py-4 rounded-xl shadow-lg transition-all" data-val="Backspace">⌫</button>
        <button class="btn btn-operator text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val="/">÷</button>

        <!-- Hàng 2: Số 7, 8, 9 và phép Nhân -->
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="7">7</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="8">8</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="9">9</button>
        <button class="btn btn-operator text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val="*">×</button>

        <!-- Hàng 3: Số 4, 5, 6 và phép Trừ -->
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="4">4</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="5">5</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="6">6</button>
        <button class="btn btn-operator text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val="-">-</button>

        <!-- Hàng 4: Số 1, 2, 3 và phép Cộng -->
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="1">1</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="2">2</button>
        <button class="btn btn-num text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="3">3</button>
        <button class="btn btn-operator text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val="+">+</button>

        <!-- Hàng 5: Số 0, Dấu chấm thập phân, Phím Bằng -->
        <button class="btn btn-num col-span-2 text-xl font-semibold py-4 rounded-xl shadow-lg transition-all" data-val="0">0</button>
        <button class="btn btn-num text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val=".">.</button>
        <button id="btn-equals" class="btn btn-action text-xl font-bold py-4 rounded-xl shadow-lg transition-all" data-val="=">=</button>
      </div>

      <!-- Gợi ý phím tắt nhỏ phía dưới dành cho Desktop -->
      <p class="text-[10px] text-slate-500 mt-4 text-center">Hỗ trợ đầy đủ phím tắt bàn phím: 0-9, +, -, *, /, Enter (=), Esc (C), Backspace</p>
    </div>

    <!-- PHÂN HỆ 2: PANEL LỊCH SỬ PHÉP TÍNH (HISTORY LOG) -->
    <div class="w-full max-w-sm mx-auto bg-slate-800 rounded-3xl p-6 border border-slate-700/50 shadow-2xl flex flex-col justify-between" id="history-panel">
      <div>
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
          <h2 class="text-md font-semibold text-slate-300 tracking-wider uppercase flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Lịch sử tính toán
          </h2>
          <button id="btn-clear-history" class="text-xs text-rose-400 hover:text-rose-300 font-semibold uppercase tracking-wider transition-colors">Xóa sạch</button>
        </div>
        
        <!-- Danh sách chứa lịch sử -->
        <div id="history-list" class="space-y-3 max-h-[320px] overflow-y-auto pr-1 text-sm font-mono scrollbar-thin">
          <!-- Các mục lịch sử sẽ render tự động qua JS -->
          <div class="text-slate-500 italic text-center py-8">Chưa có dữ liệu tính toán</div>
        </div>
      </div>
      
      <p class="text-[11px] text-slate-500 mt-4 italic text-center">Mẹo: Nhấp vào một dòng lịch sử để khôi phục lại phép tính đó!</p>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
```
